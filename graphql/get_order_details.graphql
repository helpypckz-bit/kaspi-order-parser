query getOrderDetails($merchantUid: String!, $orderCode: String!, $skipCustomerPhone: Boolean = false) {
  merchant(id: $merchantUid) {
    orderDetail(code: $orderCode) {
      code
      creationTime
      status
      state
      commentText
      totalPrice
      deliverySubsidyCost
      deliveryCost
      customer {
        firstName
        lastName
        phoneNumber @skip(if: $skipCustomerPhone)
      }
      delivery {
        mode
        actualDeliveryDate
      }
      destination {
        ... on Postomat {
          city {
            name
          }
        }
        ... on OrderAddress {
          city {
            name
          }
        }
        ... on Point {
          city {
            name
          }
        }
      }
      warehouse {
        ... on Postomat {
          city {
            name
          }
        }
        ... on OrderAddress {
          city {
            name
          }
        }
        ... on Point {
          name
          city {
            name
          }
        }
      }
      orderSteps {
        ... on SimpleOrderStep {
          step
          actualTime
        }
      }
      entries {
        quantity
        totalPrice
        product {
          name
        }
        merchantProduct {
          code
        }
      }
    }
  }
}
